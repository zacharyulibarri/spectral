<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectral</title>
<style>
  @font-face { font-family:"Rajdhani"; font-weight:500; font-style:normal; font-display:swap; src:url(fonts/rajdhani-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family:"Rajdhani"; font-weight:600; font-style:normal; font-display:swap; src:url(fonts/rajdhani-latin-600-normal.woff2) format("woff2"); }
  html, body { margin:0; height:100%; background:#04060d; overflow:hidden; font-family:"Rajdhani","Segoe UI","Helvetica Neue",Arial,sans-serif; color:#e3ebff; }
  :root { --rh:28px; --ua:.55; }
  #stage { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #ui { position:fixed; inset:0; pointer-events:none; font-size:calc(var(--rh) * .6); letter-spacing:.03em; text-shadow:0 0 5px rgba(0,0,0,.9); user-select:none; -webkit-user-select:none; }
  #ui > * { pointer-events:auto; }
  #head { position:absolute; left:3%; top:3.4%; font-size:calc(var(--rh) * .8); font-weight:600; pointer-events:none; }
  html.bgblack, html.bgblack body { background:#000; }
  html.bgblack .box { background:rgba(0,0,0,var(--ua)); }
  .box { background:rgba(3,6,18,var(--ua)); border:1px solid rgba(160,185,255,.16); box-sizing:border-box; }
  button { font:inherit; font-weight:600; letter-spacing:.08em; color:#e8eeff; background:rgba(120,150,255,.14); border:1px solid rgba(190,210,255,.55); padding:.6em 1.3em; cursor:pointer; border-radius:2px; font-size:clamp(13px,1.3vw,17px); }
  button:hover { background:rgba(150,180,255,.28); }
  button.ic { font-size:.9em; padding:.25em .6em; letter-spacing:.04em; font-weight:500; border-color:rgba(190,210,255,.4); }

  /* library (left) */
  #lib { position:absolute; left:3%; top:10%; width:36%; bottom:7.5%; display:flex; flex-direction:column; }
  .search { display:flex; align-items:center; padding:.45em .55em .3em; gap:.4em; }
  #q { flex:1; min-width:0; font:inherit; color:#eaf0ff; background:rgba(255,255,255,.07); border:1px solid rgba(170,195,255,.3); padding:.3em .6em; outline:none; border-radius:2px; letter-spacing:.03em; user-select:text; -webkit-user-select:text; text-shadow:none; }
  #q:focus { border-color:rgba(190,210,255,.85); background:rgba(255,255,255,.11); }
  #q::placeholder { color:rgba(220,230,255,.45); }
  #libInfo { font-size:.8em; padding:0 .55em .35em .9em; display:flex; align-items:center; justify-content:space-between; gap:.6em; }
  #libInfoTx { opacity:.62; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #libRefresh { flex:none; width:2.1em; height:1.7em; padding:0; display:flex; align-items:center; justify-content:center; letter-spacing:0; }
  #libRefresh svg { width:1.1em; height:1.1em; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #libRefresh:disabled { opacity:.5; cursor:default; }
  #libRefresh.busy svg { animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #libRandom { margin:0 .55em .45em; padding:.3em .6em; font-size:.82em; letter-spacing:.06em; font-weight:500; display:flex; align-items:center; justify-content:center; gap:.55em; border-color:rgba(190,210,255,.4); }
  #libRandom svg { width:1.15em; height:1.15em; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  /* virtual lists */
  .vlist { position:relative; overflow-y:auto; overflow-x:hidden; flex:1; min-height:0; scrollbar-width:thin; scrollbar-color:rgba(190,205,255,.4) transparent; }
  .vlist::-webkit-scrollbar { width:12px; }
  .vlist::-webkit-scrollbar-thumb { background:rgba(190,205,255,.35); border-radius:6px; border:3px solid transparent; background-clip:content-box; }
  .vlist::-webkit-scrollbar-thumb:hover { background:rgba(214,226,255,.65); background-clip:content-box; }
  .vlist .inner { position:relative; width:100%; }
  .vlist .row { position:absolute; left:0; right:0; top:0; display:flex; align-items:center; box-sizing:border-box; padding:0 .7em; white-space:nowrap; overflow:hidden; cursor:default; }
  .vlist .row:hover { background:rgba(255,255,255,.09); }
  .vlist .row.sel { background:rgba(214,222,240,.86); color:#0a1020; text-shadow:none; }
  .row .chev { width:1.4em; flex:none; text-align:center; opacity:.85; cursor:pointer; }
  .row .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .row.artist .nm { font-weight:600; }
  .row .dim { opacity:.55; margin-left:.8em; font-size:.85em; flex:none; }
  .row.album { padding-left:1.8em; }
  .row.track { padding-left:3.4em; }
  .row.track .no { width:2em; flex:none; opacity:.55; text-align:right; margin-right:.7em; }
  .row.letter { color:#d4ddf8; font-weight:600; }
  .row.letter i { flex:1; height:1px; margin-left:.8em; background:rgba(214,224,255,.5); }
  .vlist .row.letter:hover { background:none; }
  .dropline { position:absolute; left:0; right:0; height:2px; margin-top:-1px; background:#9fd0ff; box-shadow:0 0 6px #9fd0ff; pointer-events:none; display:none; z-index:2; }

  /* right column */
  #right { position:absolute; left:41.5%; right:3%; top:10%; bottom:7.5%; display:flex; flex-direction:column; min-height:0; }
  #deck { padding:.55em .9em .5em; flex:none; }
  #np { padding:0; }
  #npTitle { font-size:1.25em; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:1.3em; }
  #npSub { opacity:.7; font-size:.9em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:1.2em; }
  #mini { width:100%; height:calc(var(--rh) * 2.7); display:block; margin-top:.5em; }
  #prog { height:calc(var(--rh) * .28); background:rgba(255,255,255,.16); margin-top:.5em; cursor:pointer; position:relative; }
  #prog::before { content:''; position:absolute; left:0; right:0; top:-.5em; bottom:-.5em; }
  #prog i { display:block; height:100%; width:0; background:#e6ebf6; position:relative; }
  #prog i::after { content:''; position:absolute; right:-.4em; top:50%; width:.8em; height:.8em; margin-top:-.4em; border-radius:50%; background:inherit; opacity:0; }
  #prog.scrub i::after { opacity:1; }
  #prog.scrub { touch-action:none; }
  .times { display:flex; justify-content:space-between; margin-top:.25em; opacity:.88; }
  #ctl { display:flex; align-items:center; gap:.2em; margin-top:.45em; }
  .tb { background:none; border:none; color:#e8eeff; padding:.1em; cursor:pointer; width:calc(var(--rh) * 1.4); height:calc(var(--rh) * 1.4); display:flex; align-items:center; justify-content:center; border-radius:50%; letter-spacing:0; font-size:inherit; }
  .tb:hover { background:rgba(255,255,255,.13); }
  .tb svg { width:70%; height:70%; fill:currentColor; display:block; }
  .tb.big svg { width:86%; height:86%; }
  .tb.tog { opacity:.3; }
  .tb.tog.on { opacity:1; color:#fff; filter:drop-shadow(0 0 5px rgba(160,200,255,.95)); }
  #ctl .gap { width:1.4em; }
  #vol { width:calc(var(--rh) * 5.5); accent-color:#c3d3ff; margin-left:.2em; }

  /* playlists */
  #pl { flex:1; min-height:0; display:flex; flex-direction:column; margin-top:.7em; }
  #tabbar { display:flex; align-items:stretch; border-bottom:1px solid rgba(160,185,255,.2); }
  #tabs { flex:1; display:flex; overflow-x:auto; scrollbar-width:none; min-width:0; }
  #tabs::-webkit-scrollbar { display:none; }
  .tab { flex:none; display:flex; align-items:center; gap:.5em; padding:.4em .95em; cursor:pointer; opacity:.7; border-right:1px solid rgba(160,185,255,.12); white-space:nowrap; max-width:15em; }
  .tab .tn { overflow:hidden; text-overflow:ellipsis; }
  .tab:hover { opacity:1; background:rgba(255,255,255,.07); }
  .tab.active { opacity:1; background:rgba(214,222,240,.18); box-shadow:inset 0 -2px 0 #9fd0ff; }
  .tab.hot { background:rgba(159,208,255,.32); opacity:1; }
  .tab .pm { color:#9fd0ff; }
  .tab .x { opacity:.5; padding:0 .25em; border-radius:2px; }
  .tab .x:hover { opacity:1; background:rgba(255,255,255,.2); }
  #plSel { margin:.3em .45em; flex:none; }
  #plHead { display:flex; align-items:baseline; justify-content:space-between; padding:.5em .85em .35em; gap:1em; }
  #plTitle { font-size:1.2em; font-weight:600; cursor:text; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #plTitle input { font:inherit; color:#fff; background:rgba(255,255,255,.12); border:1px solid rgba(190,210,255,.75); outline:none; padding:0 .3em; width:16em; user-select:text; -webkit-user-select:text; text-shadow:none; }
  #plInfo { opacity:.6; font-size:.85em; white-space:nowrap; }
  .plr { display:flex; align-items:center; gap:.9em; flex:none; }
  #plClear { display:none; padding:.1em .8em; font-size:.85em; letter-spacing:.06em; }
  .row.pr .mk { width:2.6em; text-align:right; opacity:.6; margin-right:.8em; flex:none; }
  .row.pr .ar { width:30%; flex:none; opacity:.75; overflow:hidden; text-overflow:ellipsis; margin-left:.8em; }
  .row.pr .tm { width:3.8em; text-align:right; flex:none; opacity:.7; margin-left:.5em; }
  .row.playing { color:#bfe0ff; }
  .row.playing .mk { opacity:1; color:#9fd0ff; }
  .row.sel.playing { color:#0a2a5a; }
  .row.sel .mk, .row.sel .ar, .row.sel .tm { opacity:.8; }
  .row.qnext { background:rgba(255,196,92,.15); box-shadow:inset 3px 0 0 #ffc45c; }
  .row .nx { flex:none; font-size:.68em; letter-spacing:.14em; color:#ffc45c; border:1px solid currentColor; border-radius:2px; padding:0 .4em; margin-right:.7em; line-height:1.5; }
  html[data-theme="light"] .row.qnext { background:rgba(214,130,0,.13); box-shadow:inset 3px 0 0 #c77700; }
  html[data-theme="light"] .row .nx { color:#a85d00; }
  .row.missing { opacity:.45; text-decoration:line-through; }
  #ui.collapsed #lib, #ui.collapsed #pl { display:none; }

  /* drag targets */
  #dropPanel { position:fixed; left:24%; right:9%; top:2.2%; display:none; flex-wrap:wrap; gap:.4em; max-height:6.6em; overflow:hidden; z-index:6; font-size:calc(var(--rh) * .56); letter-spacing:.03em; }
  #dropPanel.on { display:flex; }
  #dropPanel .chip { padding:.35em .9em; background:rgba(8,14,40,.9); border:1px dashed rgba(190,210,255,.65); cursor:copy; }
  #dropPanel .chip.hot { background:rgba(159,208,255,.5); border-style:solid; color:#fff; }
  #dropPanel .lead { opacity:.75; align-self:center; margin-right:.4em; }

  /* context menus */
  .menu { position:fixed; z-index:20; min-width:12em; max-height:70vh; overflow-y:auto; background:rgba(8,12,30,.97); border:1px solid rgba(170,195,255,.5); padding:.25em 0; font-size:15px; box-shadow:0 6px 24px rgba(0,0,0,.6); letter-spacing:.03em; text-shadow:none; color:#e3ebff; }
  .menu .mi { padding:.35em 1.1em .35em .9em; cursor:pointer; display:flex; justify-content:space-between; gap:1.6em; white-space:nowrap; }
  .menu .mi:hover { background:rgba(150,180,255,.3); }
  .menu .mi.dis { opacity:.4; pointer-events:none; }
  .menu .sep { height:1px; margin:.25em 0; background:rgba(170,195,255,.25); }

  #hints { position:absolute; left:3%; right:3%; bottom:2.6%; font-size:calc(var(--rh) * .5); opacity:.85; display:flex; flex-wrap:wrap; gap:.3em 1.5em; pointer-events:none; }
  #hints b { font-weight:600; border:1px solid rgba(230,236,255,.55); border-radius:3px; padding:0 .4em; margin-right:.4em; }
  #stats { position:absolute; right:2%; bottom:7%; font:12px/1.4 ui-monospace,Menlo,Consolas,monospace; opacity:.85; white-space:pre; text-align:right; display:none; pointer-events:none; }
  #msg { position:fixed; left:50%; top:3%; transform:translateX(-50%); font-size:14px; color:#ffd2a8; background:rgba(8,12,30,.9); padding:.4em 1em; border:1px solid rgba(255,200,150,.4); display:none; z-index:30; }
  #gear { position:fixed; right:2.2%; top:3.6%; z-index:7; width:2.4em; height:2.4em; padding:0; display:flex; align-items:center; justify-content:center; font-size:clamp(14px,1.5vw,20px); opacity:.6; background:rgba(8,12,30,.45); letter-spacing:0; }
  #hideUI { position:fixed; right:calc(2.2% + 2.9em); top:3.6%; z-index:7; width:2.4em; height:2.4em; padding:0; display:flex; align-items:center; justify-content:center; font-size:clamp(14px,1.5vw,20px); opacity:.6; background:rgba(8,12,30,.45); letter-spacing:0; }
  #hideUI svg { width:1.2em; height:1.2em; fill:none; stroke:currentColor; stroke-width:1.6; }
  #hideUI:hover, #hideUI.on { opacity:1; }
  #gear:hover, #gear.on { opacity:1; }
  #gear.hidden { display:none; }
  #panel { position:fixed; right:2.2%; top:calc(3.6% + 46px); z-index:7; width:min(340px,92vw); max-height:80vh; overflow:auto; display:none; box-sizing:border-box; padding:12px 16px 14px; background:rgba(6,10,28,.94); border:1px solid rgba(170,195,255,.45); font-size:15px; letter-spacing:.04em; }
  #panel.open { display:block; }
  #panel h2 { margin:0 0 6px; font-size:15px; letter-spacing:.2em; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  #panel h3 { margin:14px 0 4px; font-size:12px; letter-spacing:.22em; opacity:.6; font-weight:600; border-bottom:1px solid rgba(170,195,255,.25); padding-bottom:3px; }
  #panel .row { margin:9px 0; }
  #panel .lab { display:flex; justify-content:space-between; gap:8px; }
  #panel .val { opacity:.8; font-variant-numeric:tabular-nums; }
  #panel input[type=range] { width:100%; margin:4px 0 0; accent-color:#9db4ff; }
  #panel label.chk { display:flex; align-items:center; gap:8px; cursor:pointer; }
  #panel .note { font-size:12px; opacity:.6; margin-top:2px; line-height:1.25; }
  #panel .pre { display:flex; gap:6px; margin-top:4px; }
  #panel button.sm { font-size:12px; padding:.2em .7em; letter-spacing:.06em; }
  #panel .fl { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; padding:2px 0; word-break:break-all; }
  #panel .fadd { display:flex; gap:6px; margin-top:6px; }
  #panel .numrow { display:flex; align-items:center; gap:8px; margin-top:4px; }
  #panel .numrow input { width:6.5em; font:inherit; font-size:14px; color:#eaf0ff; background:rgba(255,255,255,.08); border:1px solid rgba(170,195,255,.35); padding:2px 6px; outline:none; user-select:text; -webkit-user-select:text; }
  #panel .numrow input:focus { border-color:rgba(190,210,255,.85); }
  #panel .numrow .unit { opacity:.65; font-size:13px; }
  #welcome, #tagEd { position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; background:rgba(2,4,12,.72); }
  #welcome.open, #tagEd.open { display:flex; }
  #welcome .card, #tagEd .card { width:min(520px,92vw); max-height:92vh; overflow:auto; box-sizing:border-box; padding:22px 26px 20px; background:rgba(6,10,28,.97); border:1px solid rgba(170,195,255,.45); font-size:15px; letter-spacing:.03em; line-height:1.4; }
  #welcome h1, #tagEd h1 { margin:0 0 10px; font-size:20px; letter-spacing:.24em; font-weight:600; }
  #welcome h3, #tagEd h3 { margin:16px 0 6px; font-size:12px; letter-spacing:.22em; opacity:.6; font-weight:600; border-bottom:1px solid rgba(170,195,255,.25); padding-bottom:3px; }
  #welcome p, #tagEd p { margin:6px 0; }
  #welcome .fl, #tagEd .fl { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:3px 0; word-break:break-all; font-size:14px; }
  #welcome .note, #tagEd .note { font-size:12px; opacity:.6; margin-top:4px; }
  #welcome .tips, #tagEd .tips { display:grid; grid-template-columns:auto 1fr; gap:3px 14px; font-size:13px; }
  #welcome .tips b, #tagEd .tips b { font-weight:600; opacity:.9; white-space:nowrap; }
  #welcome .acts, #tagEd .acts { display:flex; gap:10px; margin-top:16px; align-items:center; }
  #welcome button.go, #tagEd button.go { font-size:15px; padding:.35em 1.3em; letter-spacing:.08em; }
  #welcome button.sm, #tagEd button.sm { font-size:12px; padding:.2em .7em; letter-spacing:.06em; }
  html[data-theme] #welcome, html[data-theme] #tagEd { background:rgba(0,0,0,.35); }
  html[data-theme] #welcome .card, html[data-theme] #tagEd .card { background:var(--bg); color:var(--fg); border-color:var(--line); }
  html[data-theme] #welcome h3, html[data-theme] #tagEd h3 { border-color:var(--line); }
  #tagEd .grid { display:grid; grid-template-columns:130px 1fr; gap:8px 12px; align-items:center; margin-top:8px; }
  #tagEd .lb { font-size:13px; opacity:.8; }
  #tagEd input[type=text] { font:inherit; font-size:14px; color:#eaf0ff; background:rgba(255,255,255,.08); border:1px solid rgba(170,195,255,.35); padding:4px 8px; outline:none; width:100%; box-sizing:border-box; user-select:text; -webkit-user-select:text; }
  #tagEd input[type=text].chg { border-color:#9db4ff; background:rgba(157,180,255,.16); }
  #tagEd input[type=text].err { border-color:#ff8a7a; }
  #tagEd .chk { display:flex; gap:8px; align-items:center; margin-top:12px; font-size:13px; cursor:pointer; }
  #tagEd .res { font-size:13px; max-height:30vh; overflow:auto; margin-top:8px; word-break:break-all; line-height:1.35; }
  #tagEd .prog { height:4px; background:rgba(255,255,255,.16); margin-top:14px; } #tagEd .prog i { display:block; height:100%; width:0; background:#e6ebf6; }
  #tagEd .acts .sp { flex:1; font-size:13px; opacity:.75; }
  html[data-theme] #tagEd input[type=text] { color:var(--fg); background:var(--soft); border-color:var(--line); }
  html[data-theme] #tagEd input[type=text].chg { border-color:var(--acc); }
  html[data-theme] #tagEd .prog { background:var(--line); } html[data-theme] #tagEd .prog i { background:var(--fg); }
  #undoBar { position:fixed; left:50%; top:3%; transform:translateX(-50%); font-size:14px; color:#d8f5e8; background:rgba(8,12,30,.92); padding:.35em .5em .35em 1em; border:1px solid rgba(150,230,190,.45); display:none; z-index:31; align-items:center; gap:.9em; }
  #undoBar.open { display:flex; }
  #undoBar button { font-size:13px; padding:.15em .8em; }
  /* lightweight display modes (Ctrl+L): no waterfall is calculated or drawn, the page is a plain light or dark surface */
  html[data-theme="light"] { --bg:#fff; --fg:#14171c; --soft:rgba(0,0,0,.07); --hover:rgba(0,0,0,.13); --line:rgba(0,0,0,.2); --btnb:rgba(0,0,0,.4); --boxbg:rgba(0,0,0,.03); --sel:#1d2530; --selfg:#fff; --acc:#0b62b8; }
  html[data-theme="dark"] { --bg:#2b2d31; --fg:#f4f4f4; --soft:rgba(255,255,255,.09); --hover:rgba(255,255,255,.17); --line:rgba(255,255,255,.2); --btnb:rgba(255,255,255,.4); --boxbg:rgba(255,255,255,.04); --sel:#ececf0; --selfg:#14171c; --acc:#8fc4ff; }
  html[data-theme], html[data-theme] body { background:var(--bg); color:var(--fg); }
  html[data-theme] #stage { display:none; }
  html[data-theme] #ui { text-shadow:none; }
  html[data-theme] .box { background:var(--boxbg); border-color:var(--line); }
  html[data-theme] button { color:var(--fg); background:var(--soft); border-color:var(--btnb); }
  html[data-theme] button:hover { background:var(--hover); }
  html[data-theme] #gear, html[data-theme] #hideUI { background:var(--soft); }
  html[data-theme] .tb { background:none; color:var(--fg); }
  html[data-theme] .tb:hover { background:var(--soft); }
  html[data-theme] .tb.tog.on { color:var(--fg); filter:none; }
  html[data-theme] #panel .numrow input { color:var(--fg); background:var(--soft); border-color:var(--line); }
  html[data-theme] #q, html[data-theme] #panel .fadd input { color:var(--fg); background:var(--soft); border-color:var(--line); }
  html[data-theme] #q:focus { border-color:var(--fg); background:var(--soft); }
  html[data-theme] #q::placeholder { color:var(--fg); opacity:.45; }
  html[data-theme] .vlist { scrollbar-color:var(--line) transparent; }
  html[data-theme] .vlist::-webkit-scrollbar-thumb { background:var(--line); background-clip:content-box; }
  html[data-theme] .vlist .row:hover { background:var(--soft); }
  html[data-theme] .vlist .row.sel { background:var(--sel); color:var(--selfg); }
  html[data-theme] .row.letter { color:var(--fg); }
  html[data-theme] .row.letter i { background:var(--line); }
  html[data-theme] .row.playing, html[data-theme] .row.playing .mk { color:var(--acc); }
  html[data-theme] .row.sel.playing { color:var(--selfg); }
  html[data-theme] .dropline { background:var(--acc); box-shadow:none; }
  html[data-theme] #prog { background:var(--line); }
  html[data-theme] #prog i { background:var(--fg); }
  html[data-theme] #vol { accent-color:var(--fg); }
  html[data-theme] #tabbar, html[data-theme] .tab { border-color:var(--line); }
  html[data-theme] .tab:hover { background:var(--soft); }
  html[data-theme] .tab.active { background:var(--soft); box-shadow:inset 0 -2px 0 var(--acc); }
  html[data-theme] .tab.hot { background:var(--acc); color:#fff; }
  html[data-theme] .tab .pm { color:var(--acc); }

/* ======================= scene state ======================= */
const amps = new Float32Array(NR * NB), rowT = new Float64Array(NR).fill(-1e9), rowHue = new Float32Array(NR), rowSch = new Uint8Array(NR);

let camAuto = true, showStats = false, uiHidden = false;

function heightOf(a) { return CFG.hMin + (S.flat ? 0 : CFG.hAmp * S.hGain * a); }

function updateAudio(dt) {
  let mx;
  if (analyser) { if (actx.state === 'running') mx = readSpectrum(); else { raw.fill(0); mx = 0; } }
  else mx = idleSpectrum(simT);
  peak = Math.max(peak * Math.exp(-dt * 0.12), mx, 0.5);
  const gn = 0.95 / peak, kd = Math.exp(-dt * 4.0), ka = Math.min(1, dt * (18 + 0.6 * S.rate)), ke = Math.min(1, dt * 0.12);
  for (let b = 0; b < NB; b++) {
    const v = Math.min(1, raw[b] * gn);
    sm[b] = v > sm[b] ? sm[b] + (v - sm[b]) * ka : sm[b] * kd;
    avg[b] += (sm[b] - avg[b]) * ke;
    // blend absolute level with level relative to each band's own average: keeps the whole sheet alive and fairly even
    const rel = Math.min(1.25, sm[b] / (avg[b] * 1.7 + 0.03));
    tmpA[b] = Math.min(1, S.logScale ? 0.9 * sm[b] + 0.1 * rel : 0.5 * sm[b] + 0.38 * rel);   // the linear-mode blend halves the range; log mode keeps almost all of it
  }
  for (let b = 0; b < NB; b++) {       // 5-tap binomial smoothing across frequency
    const a0 = tmpA[Math.max(0, b - 2)], a1 = tmpA[Math.max(0, b - 1)], a3 = tmpA[Math.min(NB - 1, b + 1)], a4 = tmpA[Math.min(NB - 1, b + 2)];
    curA[b] = (a0 + 4 * a1 + 6 * tmpA[b] + 4 * a3 + a4) / 16;
  }
  if (analyser && actx.state === 'running' && mx > 0) {                      // running whole-track average (fallback for the mini spectrum)
    runN++; const k = 1 / Math.min(runN, 3000);
    for (let j = 0; j < MINI_N; j++) { const b0 = Math.floor(j / MINI_N * NB), b1 = Math.max(b0 + 1, Math.floor((j + 1) / MINI_N * NB)); let v = 0; for (let b = b0; b < b1; b++) v = Math.max(v, sm[b]); runSpec[j] += (v - runSpec[j]) * k; }
  }
  hueBase += dt * (4 + 3 * Math.sin(simT * 0.07));
  if (simT - lastEmit > 0.5) lastEmit = simT;
  while (simT - lastEmit >= rowDt) {
    lastEmit += rowDt; head = (head + 1) % NR;

}

  { k: 'lines', label: 'Bold structure lines below the floor', bool: true },
  { k: 'text', label: 'Text blocks below the floor', bool: true },
  { k: 'flat', label: 'Flat heights', bool: true },
  { sec: 'Performance' },
  { k: 'fpsCap', label: 'Frame-rate cap', min: 20, max: 144, step: 1, fmt: v => (v >= 144 ? 'off' : v + ' fps'), pre: [['30', 30], ['60', 60], ['off', 144]], note: 'Lower uses less CPU, which matters for a player that stays open all day.' },
  { k: 'adaptive', label: 'Adaptive resolution', bool: true, note: 'Lowers the internal resolution automatically if the frame rate drops.' },
];
const panel = $('#panel'), gear = $('#gear'), ctl = {};
for (const it of SCHEMA) if (it.k && !it.bool) S[it.k] = clamp(+S[it.k] || DEF[it.k], it.min, it.max);
function applyRate(r) {

    const ratio = nd / rowDt;
    for (let i = 0; i < NR; i++) if (rowT[i] > -1e8) rowT[i] = simT - (simT - rowT[i]) * ratio;
    if (rowT[head] > -1e8) lastEmit = rowT[head];
  }

}
function applyUI() {
  rowH = Math.round(clamp(innerWidth * 0.0152, 20, 34) * S.textSize);
  const r = document.documentElement.style; r.setProperty('--rh', rowH + 'px'); r.setProperty('--ua', S.uiAlpha);
  $('#ui').classList.toggle('collapsed', !!S.collapsed); $('#hideUI').classList.toggle('on', !!S.collapsed);
  libList.relayout(); plList.relayout();
}
function applyTheme() {
  if (S.theme !== 'light' && S.theme !== 'dark') S.theme = 'waterfall';
  if (S.theme === 'waterfall') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme);
  mini && drawMini();
}
function onSetting(k) {
  if (k === 'rate') { applyRate(S.rate); if (analyser) analyser.smoothingTimeConstant = S.rate >= 30 ? 0.4 : 0.55; }
  else if (k === 'adaptive' && !S.adaptive && qual < 1) { qual = 1; resize(); }
  else if (k === 'uiAlpha' || k === 'textSize' || k === 'collapsed') applyUI();
  else if (k === 'ignoreThe') { buildIndex(); applyFilter(); rebuildFlat(); }
  else if (k === 'vol' || k === 'muted') { applyVolume(); syncButtons(); }
  else if (k === 'repeat' || k === 'shuffle') syncButtons();
  else if (k === 'gapless' && !S.gapless) dropPre();
  else if (k === 'mediaOverlay') { syncMedia(); if (host.desktop && !!S.mediaOverlay !== host.mediaOverlay) showMsg('Restart Spectral for the media overlay change to take full effect'); }
  else if (k === 'theme') applyTheme();
  else if (k === 'bgBlack') applyBg();
  else if (k === 'randomCount') updateRandomLabel();

}
const SKEEP = ['rate', 'camMotion'];                      // (all keys are persisted; this list is only documentation)
function saveS() {
  const json = JSON.stringify(S);
  try { if (host.saveSettings) host.saveSettings(S); } catch (_) {}
  try { localStorage.setItem(SKEY, json); } catch (_) {}
}
function setS(k, v) { S[k] = v; onSetting(k); saveS(); syncPanel(); }
function syncPanel() {
  for (const it of SCHEMA) if (it.k) { const c = ctl[it.k]; if (!c) continue; if (it.bool) c.inp.checked = !!S[it.k]; else if (it.num) { if (document.activeElement !== c.inp) c.inp.value = S[it.k]; } else { c.inp.value = S[it.k]; c.val.textContent = it.fmt(S[it.k]); } }

let folderBox = null;
function renderFolders() {
  if (!folderBox) return; folderBox.list.textContent = '';
  if (!S.folders.length) folderBox.list.appendChild(el('div', 'note', 'No folders yet. Add the folders that hold your music.'));
  const commit = () => { saveS(); renderFolders(); if (host.setFolders) host.setFolders(S.folders); };
  S.folders.forEach((f, i) => {
    const r = el('div', 'fl'); r.appendChild(el('span', '', (i === 0 ? 'Primary: ' : '') + f));
    if (i === 0) {                                      // the primary folder can be changed but never removed
      if (host.pickFolder) { const c = el('button', 'sm', 'Change…'); c.onclick = async () => { const p = await host.pickFolder(); if (!p) return; const n = normPath(p); const dup = S.folders.findIndex((q, k) => k && q.toLowerCase() === n.toLowerCase()); if (dup > 0) S.folders.splice(dup, 1); S.folders[0] = n; commit(); }; r.appendChild(c); }
    } else { const x = el('button', 'sm', 'remove'); x.onclick = () => { S.folders.splice(i, 1); commit(); }; r.appendChild(x); }
    folderBox.list.appendChild(r);
  });
}
function buildPanel() {
  const h = el('h2'); h.appendChild(el('span', '', 'SETTINGS')); const x = el('button', 'sm', '\u00d7'); x.onclick = () => togglePanel(false); h.appendChild(x); panel.appendChild(h);
  for (const it of SCHEMA) {
    if (it.sec) { panel.appendChild(el('h3', '', it.sec.toUpperCase())); continue; }
    const row = el('div', 'row');
    if (it.folders) {
      const list = el('div'), add = el('div', 'fadd'), inp = el('input'), b = el('button', 'sm', host.pickFolder ? 'Add folder\u2026' : 'Add');
      inp.placeholder = 'C:/Music'; inp.style.display = host.pickFolder ? 'none' : '';
      b.onclick = async () => { let f = host.pickFolder ? await host.pickFolder() : inp.value.trim(); if (!f) return; f = normPath(f); if (S.folders.indexOf(f) < 0) { S.folders.push(f); saveS(); renderFolders(); if (host.setFolders) host.setFolders(S.folders); } inp.value = ''; };
      inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') b.onclick(); });
      add.append(inp, b); const rs = el('button', 'sm', 'Rescan now'); rs.onclick = () => { if (host.rescan) host.rescan(); else showMsg('This preview uses a built-in demo library; the desktop app scans these folders.'); };
      add.appendChild(rs); const tp = el('button', 'sm', 'Quick tips'); tp.onclick = () => { togglePanel(false); showWelcome(false); }; add.appendChild(tp);
      if (host.undoTags) { const ut = el('button', 'sm', 'Undo tag edit'); ut.title = 'Put the tags back as they were before the last Edit tags'; ut.onclick = () => { togglePanel(false); askUndo(); }; add.appendChild(ut); } row.append(list, add); if (host.playlistDir) row.appendChild(el('div', 'note', 'Playlists (.m3u) are read from and saved to ' + host.playlistDir)); folderBox = { list }; panel.appendChild(row); continue;
    }
    if (it.num) {                                                      // a number typed into a box (no slider)
      const lab = el('div', 'lab'), inp = el('input'), box = el('div', 'numrow'); lab.appendChild(el('span', '', it.label));
      inp.type = 'number'; inp.min = it.min; inp.max = it.max; inp.step = 1; inp.inputMode = 'numeric'; inp.autocomplete = 'off';
      const commit = () => { const v = Math.round(+inp.value); const n = Number.isFinite(v) && inp.value.trim() !== '' ? clamp(v, it.min, it.max) : S[it.k]; inp.value = n; if (n !== S[it.k]) setS(it.k, n); };   // blank or nonsense goes back to what it was; too big or small is clamped
      inp.addEventListener('change', commit); inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { commit(); inp.blur(); } else if (e.key === 'Escape') { inp.value = S[it.k]; inp.blur(); } });
      box.append(inp, el('span', 'unit', it.unit || '')); row.append(lab, box); ctl[it.k] = { inp };
    } else if (it.bool) {
      const l = el('label', 'chk'), inp = el('input'); inp.type = 'checkbox'; inp.onchange = () => { setS(it.k, inp.checked); inp.blur(); };
      l.appendChild(inp); l.appendChild(document.createTextNode(it.label)); row.appendChild(l); ctl[it.k] = { inp };
    } else {
      const lab = el('div', 'lab'), val = el('span', 'val'), inp = el('input'); lab.appendChild(el('span', '', it.label)); lab.appendChild(val);
      inp.type = 'range'; inp.min = it.min; inp.max = it.max; inp.step = it.step; inp.oninput = () => setS(it.k, +inp.value); inp.onchange = () => inp.blur();
      row.appendChild(lab); row.appendChild(inp); ctl[it.k] = { inp, val };
      if (it.pre) { const pr = el('div', 'pre'); for (const [n, v] of it.pre) { const b = el('button', 'sm', n); b.onclick = () => { setS(it.k, v); b.blur(); }; pr.appendChild(b); } row.appendChild(pr); }
    }
    if (it.note) row.appendChild(el('div', 'note', it.note));
    panel.appendChild(row);
  }
  const rs = el('button', 'sm', 'RESET TO DEFAULTS'); rs.style.marginTop = '14px';
  rs.onclick = () => { const f = S.folders; Object.assign(S, DEF); S.folders = f; for (const k of ['rate', 'adaptive', 'uiAlpha', 'ignoreThe', 'vol', 'theme', 'bgBlack', 'randomCount']) onSetting(k); saveS(); syncPanel(); syncButtons(); rs.blur(); };
  panel.appendChild(rs);
}
function togglePanel(on) { const open = on === undefined ? !panel.classList.contains('open') : on; panel.classList.toggle('open', open); gear.classList.toggle('on', open); }
gear.onclick = () => { togglePanel(); gear.blur(); };
$('#hideUI').onclick = e => { toggleCollapse(); e.currentTarget.blur(); };
buildPanel(); syncPanel(); applyRate(S.rate);

cutTo(0);
resize(); initApp();
applyTheme(); applyBg();
requestAnimationFrame(frame);
})();
